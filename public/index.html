@media(max-width:780px){body{background-attachment:scroll}.brand-head{margin-bottom:12px}.brand-kicker{max-width:150px;text-align:right;font-size:12px}.home-layout{grid-template-columns:1fr;gap:8px}.home-hero{min-height:240px;padding:14px 0}.hero-title{font-size:clamp(48px,11vw,80px);margin:12px 0}.home-hero p{max-width:75%;font-size:14px}.hero-owl{height:240px;right:-4%;opacity:.72}.entry-panel{padding:18px}.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lobby-top h1{font-size:48px}.game-grid{grid-template-columns:1fr;gap:10px}.game-main{grid-row:1}.game-leader{grid-row:2;max-height:300px}.game-side{grid-row:3}.game-grid .panel{padding:13px}.game-center .option{min-height:88px}.case-text{font-size:clamp(18px,4.6vw,25px)}.streak-top{font-size:22px}.round-header{padding:9px 12px}.round-tags>span{padding:6px;font-size:11px}.round-tags .timer{font-size:29px}.podium-owl{height:85px}.lobby-panel{padding:12px}.team-card{min-height:86px}.team-portrait{height:65px;width:65px}}
@media(max-width:480px){.wrap{padding:12px 9px 35px}.hero-owl{max-width:43%;height:200px}.home-hero p{max-width:62%}.home-facts span{font-size:10px;padding:6px}.team-grid{gap:7px}.team-card{padding:6px;gap:3px}.team-portrait{width:45px;height:55px}.team-info strong{font-size:14px}.room-code{padding:8px}.room-code strong{font-size:29px}.options-grid{grid-template-columns:1fr;gap:9px}.game-center .option{min-height:68px;font-size:15px}.case-text{margin:8px 0 13px}.game-grid .score{flex-wrap:nowrap}.streak-levels{font-size:10px}.podium{gap:4px}.podium-step.gold{height:160px}.podium-step.silver{height:115px}.podium-step.bronze{height:100px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><header class="brand-head"><div class="brand-logo">CÓDIGO <span>AZUL</span><small>VICE CITY EDITION</small></div><div class="brand-kicker">MISIÓN COMUNICACIÓN <span>✦</span> MULTIJUGADOR EN VIVO</div></header><div id="app"></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),app=document.getElementById('app'),avatars=['buho-01','buho-02','buho-03','buho-04','buho-05','buho-06','buho-07','buho-08','buho-09','buho-10','buho-11','buho-12','buho-13','buho-14','buho-15','buho-16','buho-17','buho-18','buho-19','buho-20'];let role='',room='',state=null,selected=false,clock=null,avatar=avatars[0],myName='',lastIndex=-1,earned=null,personal=null,personalHistory=null;
const emoteRotation={esperando:0,acierto:0,error:0,tiempo:0,racha:0};let lastEmoteEvent='',currentEmote=5,lastEmote=-1;
// Identificadores de avatar compartidos con el servidor (20 opciones).
const avatarImg=(value,cls='portrait')=>{const id=avatars.includes(value)?value:avatars[0];return `<img class="${cls}" src="/avatars/${id}.webp" alt="Avatar de búho médico" loading="lazy" onerror="this.onerror=null;this.src='/emotes/buho-01.webp'">`};
const avatarChooser=(selectedAvatar=avatar)=>`<div class="avatar-picker">${avatars.map((a,i)=>`<button type="button" class="avatar ${a===selectedAvatar?'active':''}" data-a="${i}" aria-label="Seleccionar avatar ${i+1}" title="Búho ${i+1}">${avatarImg(a,'avatar-art')}</button>`).join('')}</div>`;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(id,label)=>`<button class="big" id="${id}">${label}</button>`;
const rules=()=>`<div class="rules"><h3>📜 Reglas de la competencia</h3><ol><li>Una mesa = un hospital, un celular por mesa.</li><li>20 preguntas, con 25 segundos para responder cada una.</li><li>Fácil: 100 pts · Media: 200 pts · Difícil: 300 pts. Las últimas 3 son finales de 900 pts.</li><li>Responde en los primeros 10 segundos para obtener el 100%. Después, cada acierto vale el 80%.</li><li>Si todas las mesas responden, la pregunta termina inmediatamente.</li><li>Después de cada pregunta aparece el ranking en vivo.</li><li>Rachas: 3 aciertos +10%, 5 +25%, 8 +40%. Fallar reinicia la racha.</li><li>El equipo con más puntos al final gana.</li></ol></div>`;
function home(){app.innerHTML=`<section class="home-layout"><div class="home-hero"><div class="hero-label">TU CIUDAD. TU HOSPITAL. TU MISIÓN.</div><h1 class="hero-title">LA CIUDAD<br><em>TE NECESITA.</em></h1><p>Veinte casos. Decisiones difíciles. Una sola misión: dominar la comunicación médico-paciente.</p><div class="home-facts"><span>◷ 25 SEGUNDOS</span><span>▣ 20 CASOS</span><span>✦ EN VIVO</span></div><img class="hero-owl" src="/avatars/buho-04.webp" alt="Búho médico de Código Azul"></div><div class="panel entry-panel"><div class="panel-eyebrow">CENTRO DE OPERACIONES</div><h2>ENTRA A LA MISIÓN</h2><button class="big primary-cta" id="host">CREAR SALA <span>▶</span></button><div class="form-divider">O ÚNETE A UNA SALA</div><label for="code">CÓDIGO DE SALA</label><input id="code" placeholder="Ej. 123456" inputmode="numeric" maxlength="6"><label for="name">NOMBRE DE TU HOSPITAL</label><input id="name" placeholder="Ej. Los Vochitecos" maxlength="32"><h3>ELIGE TU BÚHO MÉDICO</h3>${avatarChooser()}<button class="big join-cta" id="join">UNIRSE A SALA <span>→</span></button><p id="msg" role="alert"></p></div></section><details class="rules-disclosure"><summary>REGLAS Y BONIFICACIONES DE LA MISIÓN</summary>${rules()}</details>`;document.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{avatar=avatars[Number(b.dataset.a)];document.querySelectorAll('.avatar').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('host').onclick=()=>socket.emit('create',{},r=>{if(r.ok){role='host';room=r.code}else document.getElementById('msg').textContent=r.error||'No se pudo crear la sala'});document.getElementById('join').onclick=()=>socket.emit('join',{code:document.getElementById('code').value.trim(),name:document.getElementById('name').value,avatar},r=>{if(r.ok){role='team';myName=document.getElementById('name').value.trim();room=document.getElementById('code').value.trim()}else document.getElementById('msg').textContent=r.error})}
function scores(){return `<aside class="panel game-leader"><div class="panel-eyebrow">TABLA DE POSICIONES</div><h2>CLASIFICACIÓN</h2><div class="leader-list">${state.teams.map((t,i)=>`<div class="score ${role==='team'&&t.name===myName?'me':''}"><span class="rank-index">${i+1}°</span>${avatarImg(t.avatar)}<span class="score-name"><b>${e(t.name)}</b>${state.status==='question'&&t.answered?'<small>RESPONDIÓ ✓</small>':''}${!t.connected?'<small>DESCONECTADO</small>':''}</span><strong>${t.score.toLocaleString('es-MX')}</strong></div>`).join('')||'<p>Esperando hospitales...</p>'}</div></aside>`}
function render(){if(!state)return;clearInterval(clock);if(state.status==='lobby'){app.innerHTML=`<section class="lobby-screen"><div class="lobby-top"><div><div class="panel-eyebrow">CENTRO DE OPERACIONES</div><h1>SALA DE MISIÓN</h1><p>${role==='host'?'Comparte el código para que los hospitales se unan.':'Esperando a que el anfitrión inicie la misión.'}</p></div><div class="room-code"><small>CÓDIGO DE SALA</small><strong>${e(state.code)}</strong><button id="copy-code" type="button" aria-label="Copiar código de sala">COPIAR</button></div></div><div class="lobby-panel"><div class="lobby-status"><strong>${state.teams.length} HOSPITALES CONECTADOS</strong><span>${role==='host'?'LISTOS PARA COMPETIR':'ESPERANDO AL ANFITRIÓN'}</span></div><div class="team-grid">${state.teams.map((t,i)=>`<div class="team-card">${avatarImg(t.avatar,'team-portrait')}<div class="team-info"><small>EQUIPO ${String(i+1).padStart(2,'0')}</small><strong>${e(t.name)}</strong><span class="ready-dot">● ${t.connected?'LISTO':'DESCONECTADO'}</span></div></div>`).join('')||'<p class="empty-lobby">Aún no hay equipos. ¡Comparte el código!</p>'}</div></div>${role==='team'?`<div class="panel change-avatar"><h3>CAMBIAR MI AVATAR</h3>${avatarChooser(state.teams.find(t=>t.name===myName)?.avatar||avatar)}</div>`:''}<div class="lobby-actions">${role==='host'?btn('start','▶ INICIAR MISIÓN'):'<div class="waiting">ESPERANDO AL ANFITRIÓN…</div>'}<span>20 PREGUNTAS · 25 SEGUNDOS CADA UNA</span></div></section><details class="rules-disclosure"><summary>VER REGLAS DE LA MISIÓN</summary>${rules()}</details>`;document.getElementById('copy-code')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(state.code);document.getElementById('copy-code').textContent='COPIADO ✓'}catch{document.getElementById('copy-code').textContent='SELECCIONA EL CÓDIGO'}});if(role==='host')document.getElementById('start').onclick=()=>socket.emit('start',{},r=>{if(!r.ok)alert(r.error)});document.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{avatar=avatars[Number(b.dataset.a)];socket.emit('avatar',{avatar},r=>{if(!r?.ok)alert('No se pudo cambiar el avatar')})});return}
if(state.status==='finished'){
const podiumCard=(place,klass,owl)=>{const t=state.teams[place-1];return `<div class="podium-contender ${t?'':'podium-empty'}"><div style="font-size:28px">${place===1?'👑':place===2?'🥈':'🥉'}</div>${t?`${avatarImg(t.avatar,'podium-owl')}<div class="podium-name">${e(t.name)}</div><div class="podium-points">${t.score.toLocaleString('es-MX')} pts</div>`:'<div class="podium-name">Sin equipo</div>'}<div class="podium-step ${klass}"><strong>${place}°</strong><small>${place===1?'ORO':place===2?'PLATA':'BRONCE'}</small></div></div>`};
const others=state.teams.slice(3);app.innerHTML=`<section class="final-screen"><div class="final-kicker">VICE CITY EDITION · MISIÓN COMPLETADA</div><h2 class="final-title">MISIÓN COMPLETADA</h2><p>LOS HOSPITALES QUE DOMINARON LA CIUDAD</p><div class="podium">${podiumCard(2,'silver','04')}${podiumCard(1,'gold','04')}${podiumCard(3,'bronze','05')}</div><div class="other-places">${others.map((t,i)=>`<div class="other-place"><span>${i+4}° · ${avatarImg(t.avatar)} ${e(t.name)}</span><strong>${t.score.toLocaleString('es-MX')} pts</strong></div>`).join('')}</div><p class="small">Resultados oficiales calculados por el servidor.</p></section>`;return}
const q=state.question;const result=role==='team'&&personal&&personal.index===state.index?personal:null;
const myTeam=state.teams.find(t=>t.name===myName);
const streak=result?result.streak:(myTeam?.streak||0);
const bonus=streak>=8?40:streak>=5?25:streak>=3?10:0;
const correctCount=myTeam?.correctCount??((personalHistory?.count||0)+(result?.correct?1:0));
// Cada equipo conserva una rotación propia durante la partida.
// Los 20 archivos se distribuyen por tipo de reacción; ninguna reacción consecutiva repite imagen.
const EMOTE_POOLS={
  esperando:[5,6],
  acierto:[0,1,2,3,4,7,8,9,17,18,19],
  error:[10,11,12,13,14],
  tiempo:[15,16],
  racha:[2,3,4,17,18,19]
};
function emoteIndex(){
  let category='esperando';
  if(state.status==='reveal'&&result){
    category=result.timedOut?'tiempo':!result.correct?'error':result.streak>=5?'racha':'acierto';
  }
  // La clave evita que un re-render (ranking, reloj, conexión) cambie el búho.
  const event=state.code+'|'+state.index+'|'+state.status+'|'+category+'|'+(result?.correct??'')+'|'+(result?.streak??'');
  if(event===lastEmoteEvent)return currentEmote;
  lastEmoteEvent=event;
  const pool=EMOTE_POOLS[category];
  let offset=emoteRotation[category]++;
  let next=pool[offset%pool.length];
  if(next===lastEmote&&pool.length>1){next=pool[(offset+1)%pool.length];emoteRotation[category]++}
  lastEmote=next;
  currentEmote=next;
  return next;
}
const emotePath=n=>'/emotes/buho-'+String(n+1).padStart(2,'0')+'.webp';
const phrase=result?.phrase||(state.status==='question'?(selected?'Tu respuesta está registrada. ¡Suerte, doctor!':'Lee el caso y elige con cuidado, doctor.'):'Esperando el resultado de esta ronda...');
const reactionPanel=`<div class="panel reaction"><h3>🦉 REACCIÓN DEL HOSPITAL</h3><img class="emote-img" src="${emotePath(emoteIndex())}" alt="Búho médico"><div class="reaction-phrase">“${e(phrase)}”</div></div>`;
const nextTarget=streak<3?3:streak<5?5:streak<8?8:null;
const progressBase=streak<3?0:streak<5?3:streak<8?5:8;
const progressMax=nextTarget||8;
const progressPct=nextTarget?Math.max(0,Math.min(100,100*(streak-progressBase)/(progressMax-progressBase))):100;
const statsPanel=`<section class="streak-panel"><div class="streak-top"><span>🔥 TU RACHA</span><span class="streak-bonus">BONO +${bonus}%</span></div><div class="streak-main"><strong>${streak}</strong><div><b>ACIERTOS SEGUIDOS</b><small>${nextTarget?`TE FALTAN ${nextTarget-streak} PARA +${nextTarget===3?10:nextTarget===5?25:40}%`:'¡BONIFICACIÓN MÁXIMA DESBLOQUEADA!'}</small></div></div><div class="streak-progress"><div style="width:${progressPct}%"></div></div><div class="streak-levels"><span class="${streak>=3?'unlocked':''}">3 = +10%</span><span class="${streak>=5?'unlocked':''}">5 = +25%</span><span class="${streak>=8?'unlocked':''}">8 = +40%</span></div></section>`;
const roundHeader=`<div class="round-header"><div><div class="panel-eyebrow">MISIÓN COMUNICACIÓN</div><h2>CASO ${String(state.index+1).padStart(2,'0')} <span>/ ${state.total}</span></h2></div><div class="round-tags"><span>${q?e(q.difficulty):'RESULTADOS'}</span><span>${q?q.base+' PUNTOS':'RANKING'}</span><span id="timer" class="timer"></span></div></div><div class="bar mission-bar"><div style="width:${100*(state.index+1)/state.total}%"></div></div>`;
const questionPanel=q?`<div class="case-label">✚ CASO CLÍNICO <span>${e(q.level)}</span></div><div class="case-text">${e(q.title)}</div>${role==='team'?`<div class="options-grid">${q.options.map((a,i)=>`<button class="option" data-i="${i}" ${selected?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span>${e(a)}</span></button>`).join('')}</div>`:'<p class="host-wait">LOS HOSPITALES ESTÁN TOMANDO SUS DECISIONES…</p>'}<p id="notice" class="small" role="status">${selected?'Respuesta enviada. Esperando al resto de hospitales…':''}</p>`:'';
const resultPanel=state.status==='reveal'?`<div class="answer-banner ${result?(result.correct?'correct':'wrong'):''}"><h2>${result?(result.correct?'✅ ¡RESPUESTA CORRECTA!':'❌ RESPUESTA INCORRECTA'):'📊 RESULTADOS DE LA RONDA'}</h2>${result?`<div class="answer-points">+${result.earned} pts</div><div class="mini-result">🔥 Racha: ${result.streak} · Bono: ${Math.round(result.bonus*100)}% · Puesto: #${result.rank}</div>`:''}</div><h3>Respuesta correcta: ${'ABCD'[state.reveal.correct]}</h3><p class="result-explain">${e(state.reveal.explanation)}</p>${result?`<div class="score-position">${result.above?'⬆️ Adelante: '+e(result.above.name)+' (a '+result.above.gap+' pts)':'👑 ¡Estás en primer lugar!'}</div><p class="score-position">${result.below?'⬇️ Detrás: '+e(result.below.name)+' (a '+result.below.gap+' pts)':'🏁 No tienes equipos detrás'}</p>`:''}${role==='host'?btn('next',state.index===state.total-1?'🏆 VER CAMPEONES':'➡️ SIGUIENTE PREGUNTA'):'<p class="small">Esperando al anfitrión…</p>'}`:'';
app.innerHTML=`${roundHeader}<div class="${role==='host'?'host-board':''}"><div class="game-grid">${scores()}<div class="game-main">${role==='team'?statsPanel:''}<div class="panel game-center">${questionPanel}${resultPanel}</div></div>${role==='team'?`<div class="game-side">${reactionPanel}</div>`:''}</div></div>`;

document.querySelectorAll('.emote-img').forEach(img=>{img.addEventListener('error',()=>{const d=document.createElement('div');d.className='emote-fallback';d.textContent='🦉';img.replaceWith(d)},{once:true})});
if(state.status==='question'){document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(selected)return;socket.emit('answer',{choice:Number(b.dataset.i)},r=>{if(r.ok){selected=true;earned=r.earned;document.querySelectorAll('.option').forEach(x=>x.disabled=true);b.classList.add('chosen');const n=document.getElementById('notice');if(n)n.textContent='✔️ Respuesta enviada. Esperando a las demás mesas…'}else{const n=document.getElementById('notice');if(n)n.textContent=r.error||'No se pudo registrar'}})});function tick(){const el=document.getElementById('timer');if(el){const ms=Math.max(0,state.deadline-Date.now());el.textContent='⏱️ '+Math.ceil(ms/1000)+'s';el.className='timer '+(ms>15000?'fast':'late')}}tick();clock=setInterval(tick,200)}if(state.status==='reveal'&&role==='host')document.getElementById('next').onclick=()=>socket.emit('next',{})}
socket.on('state',s=>{if(room&&s.code!==room)return;if(s.index!==lastIndex){if(personal&&personal.index===lastIndex&&personal.correct){personalHistory={count:(personalHistory?.count||0)+1}}selected=false;earned=null;personal=null;lastIndex=s.index}state=s;render()});socket.on('personal-result',r=>{personal=r;if(state?.status==='reveal'&&state.index===r.index)render()});socket.on('closed',()=>{alert('El anfitrión cerró la sala');location.reload()});home();
</script></body></html>
