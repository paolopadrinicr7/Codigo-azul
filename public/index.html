<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Código Azul | Batalla de Hospitales</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3fbff;background:#06172c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(100deg,#031126ed,#061d39e0),url('/hospital.png') center top/cover fixed}.wrap{max-width:960px;margin:auto;padding:22px 15px 60px}h1{font-size:clamp(32px,6vw,58px);letter-spacing:-1px;color:#72eeff;text-shadow:0 4px 20px #000;margin:18px 0 3px}h2{font-size:clamp(19px,4vw,25px)}.sub{font-size:13px;letter-spacing:2px;color:#bde7ff;font-weight:800}.panel{background:#09223deF;border:1px solid #4886b2;border-radius:18px;padding:21px;margin:15px 0;box-shadow:0 12px 32px #0007;backdrop-filter:blur(10px)}button,input{font:inherit;border-radius:11px;padding:13px}button{background:linear-gradient(130deg,#037cb5,#125ad2);color:white;border:1px solid #64d8fa;cursor:pointer;font-weight:800}button:disabled{opacity:.45;cursor:default}input{background:#07192e;border:1px solid #5588ac;color:white;width:100%;margin:8px 0}.big{width:100%;margin:8px 0}.option{width:100%;text-align:left;margin:6px 0;background:#173c61}.small{color:#c0d8e9;font-size:14px;line-height:1.55}.pill{display:inline-block;background:#1b4a70;border:1px solid #3979a6;border-radius:30px;padding:7px 12px;margin:3px;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:10px;background:#294661;border-radius:20px;overflow:hidden;margin:15px 0}.bar div{height:100%;background:#22d3ee;transition:width .2s}.score{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #315576}.score:first-of-type{background:#1c4c69;border-radius:9px}.winner{color:#ffdf82}.correct{border-color:#34d399!important;background:#135b49!important}.wrong{border-color:#fb7185!important;background:#713145!important}.avatars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.avatar{font-size:29px;background:#1b4160;padding:12px 2px}.avatar.active{border:3px solid #facc15;background:#285d83}.rules{background:#103452;border-radius:12px;padding:12px 18px}.rules li{margin:8px 0}.timer{font-size:32px;color:#ffe08c;font-weight:900}.muted{opacity:.72}.tag{background:#184b72;padding:5px 10px;border-radius:9px;font-size:12px;font-weight:800}.fast{color:#86efac}.late{color:#fcd34d}#msg{color:#fca5a5}

/* V4: panel competitivo inspirado en el boceto */
.wrap{max-width:1500px;padding:20px 22px 50px}.game-grid{display:grid;grid-template-columns:minmax(210px,1.05fr) minmax(360px,2.35fr) minmax(220px,1fr);gap:16px;align-items:stretch;margin-top:16px}.game-grid .panel{margin:0}.game-grid h2{margin-top:0}.game-grid .score{font-size:13px;gap:6px}.game-grid .score strong{white-space:nowrap}.game-grid .score.me{background:#174e74;border:1px solid #65d9ff;border-radius:10px}.game-center{min-height:490px}.game-center .option{padding:16px;line-height:1.5}.game-side{display:flex;flex-direction:column;gap:16px}.game-side .panel{margin:0}.stat-number{font-size:46px;font-weight:900;color:#ffd36d;line-height:1}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat-label{font-size:12px;color:#b9d4e9}.emote-img{width:min(100%,245px);aspect-ratio:1.2;object-fit:contain;display:block;margin:4px auto;filter:drop-shadow(0 6px 14px #0008)}.reaction{margin-top:auto;text-align:center}.reaction-phrase{font-size:15px;line-height:1.5;font-weight:750;color:#e9f8ff}.answer-banner{padding:18px;border-radius:16px;text-align:center}.answer-banner h2{font-size:clamp(22px,3vw,35px);margin:8px 0}.answer-points{font-size:clamp(32px,5vw,56px);font-weight:900}.result-explain{line-height:1.65;color:#d4ebf7}.mini-result{font-size:13px;color:#bad9f3}.score-position{color:#ffe4a0;font-size:13px}.game-grid .bar{margin:10px 0}.game-grid .timer{font-size:26px}.game-grid .pill{font-size:12px}.host-board .game-grid{grid-template-columns:minmax(240px,1fr) minmax(390px,2fr)}.host-board .score{font-size:clamp(16px,2vw,24px);padding:16px}.host-board .score strong{font-size:clamp(17px,2vw,26px)}.host-board .game-center{min-height:450px}
@media(max-width:850px){.wrap{padding:13px 10px 45px}.game-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.game-center{grid-column:1/-1;grid-row:1;min-height:0}.game-leader{grid-column:1;grid-row:2}.game-side{grid-column:2;grid-row:2;gap:9px}.game-grid .panel{padding:12px}.game-grid .score{font-size:11px;padding:9px 3px;flex-wrap:wrap}.game-grid .score strong{font-size:12px}.game-grid h2{font-size:17px}.stat-number{font-size:34px}.emote-img{max-width:180px}.host-board .game-grid{grid-template-columns:1fr}.host-board .game-center{min-height:0}.host-board .game-leader{grid-column:1;grid-row:2}}
@media(max-width:400px){.game-grid .score{font-size:10px}.game-grid .score strong{font-size:11px}.reaction-phrase{font-size:12px}.game-grid .pill{padding:5px 7px}.stat-grid{gap:4px}}

/* V5: ceremonia final */
.final-screen{padding:20px 4px;text-align:center}.final-kicker{color:#7deaff;font-weight:800;letter-spacing:2px}.final-title{font-size:clamp(28px,5vw,56px);color:#ffdf8b;text-shadow:0 0 24px #edaa3460;margin:8px 0 20px}.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:12px;max-width:1000px;margin:25px auto 0}.podium-contender{display:flex;flex-direction:column;align-items:center;justify-content:end;min-width:0}.podium-owl{width:min(100%,140px);height:115px;object-fit:contain;filter:drop-shadow(0 0 18px #ffc14d88)}.podium-name{font-size:clamp(13px,2vw,22px);font-weight:900;overflow-wrap:anywhere}.podium-points{color:#dceafc;font-size:clamp(12px,1.5vw,18px)}.podium-step{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px 18px 0 0;box-shadow:inset 0 2px 15px #ffffff20,0 0 25px #0009;font-weight:900}.podium-step strong{font-size:clamp(30px,5vw,70px)}.podium-step.silver{height:150px;background:linear-gradient(#899ab4,#394d6e)}.podium-step.gold{height:215px;background:linear-gradient(#e9b83d,#785018);border:2px solid #ffe08d;box-shadow:0 0 35px #ffd15b66}.podium-step.bronze{height:115px;background:linear-gradient(#be855b,#67412c)}.other-places{max-width:850px;margin:20px auto;display:grid;gap:8px}.other-place{display:flex;justify-content:space-between;gap:10px;background:#172b48;border:1px solid #44617f;border-radius:12px;padding:13px 18px}.podium-empty{opacity:.35}.podium-contender{animation:riseIn .7s both}.podium-contender:nth-child(1){animation-delay:.2s}.podium-contender:nth-child(2){animation-delay:.85s}.podium-contender:nth-child(3){animation-delay:0s}@keyframes riseIn{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}.emote-fallback{font-size:75px;text-align:center;padding:20px}
@media(max-width:650px){.podium{gap:5px}.podium-owl{height:75px}.podium-step.silver{height:105px}.podium-step.gold{height:150px}.podium-step.bronze{height:85px}.podium-name{font-size:12px}.final-screen{padding:8px 0}}
</style></head><body><main class="wrap"><div class="row"><span class="pill">🏥 HOSPITAL CENTRAL</span><span class="pill">⚡ MULTIJUGADOR EN VIVO</span></div><h1>🚨 CÓDIGO AZUL</h1><div class="sub">BATALLA DE HOSPITALES · MISIÓN COMUNICACIÓN</div><div id="app"></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),app=document.getElementById('app'),avatars=['🧑‍⚕️','👩‍⚕️','👨‍⚕️','👩🏽‍⚕️','👨🏾‍⚕️','🥼','🩺','🚑','🧠','🦸'];let role='',room='',state=null,selected=false,clock=null,avatar=avatars[0],myName='',lastIndex=-1,earned=null,personal=null,personalHistory=null;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(id,label)=>`<button class="big" id="${id}">${label}</button>`;
const rules=()=>`<div class="rules"><h3>📜 Reglas de la competencia</h3><ol><li>Una mesa = un hospital, un celular por mesa.</li><li>20 preguntas, con 25 segundos para responder cada una.</li><li>Fácil: 100 pts · Media: 200 pts · Difícil: 300 pts. Las últimas 3 son finales de 900 pts.</li><li>Responde en los primeros 10 segundos para obtener el 100%. Después, cada acierto vale el 80%.</li><li>Si todas las mesas responden, la pregunta termina inmediatamente.</li><li>Después de cada pregunta aparece el ranking en vivo.</li><li>Rachas: 3 aciertos +10%, 5 +25%, 8 +40%. Fallar reinicia la racha.</li><li>El equipo con más puntos al final gana.</li></ol></div>`;
function home(){app.innerHTML=`<div class="panel"><h2>🏆 Compite por tu hospital</h2><p>Escoge un avatar, reúne a tu mesa y demuestra quién domina la comunicación médico-paciente.</p>${btn('host','🖥️ Crear partida como anfitrión')}<hr style="border-color:#315576"><input id="code" placeholder="Código de sala (6 dígitos)" inputmode="numeric" maxlength="6"><input id="name" placeholder="Nombre de tu hospital" maxlength="32"><h3>🎭 Elige tu avatar</h3><div class="avatars">${avatars.map((a,i)=>`<button class="avatar ${i===0?'active':''}" data-a="${i}">${a}</button>`).join('')}</div>${btn('join','📱 Entrar como mesa')}<p id="msg"></p></div>${rules()}`;document.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{avatar=avatars[Number(b.dataset.a)];document.querySelectorAll('.avatar').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('host').onclick=()=>socket.emit('create',{},r=>{if(r.ok){role='host';room=r.code}});document.getElementById('join').onclick=()=>socket.emit('join',{code:document.getElementById('code').value.trim(),name:document.getElementById('name').value,avatar},r=>{if(r.ok){role='team';myName=document.getElementById('name').value.trim();room=document.getElementById('code').value.trim()}else document.getElementById('msg').textContent=r.error})}
function scores(){return `<div class="panel game-leader"><h2>🏅 Clasificación en vivo</h2>${state.teams.map((t,i)=>`<div class="score ${role==='team'&&t.name===myName?'me':''}"><span><b>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'.'}</b> ${e(t.avatar)} ${e(t.name)} ${state.status==='question'&&t.answered?'✔️':''}${!t.connected?' <span class="muted">(desconectado)</span>':''}</span><strong>${t.score} pts</strong></div>`).join('')||'<p>Esperando equipos...</p>'}</div>`}
function render(){if(!state)return;clearInterval(clock);if(state.status==='lobby'){app.innerHTML=`<div class="panel"><h2>🔑 SALA ${e(state.code)}</h2><p class="small">Comparte este código y la dirección de esta página con todas las mesas.</p><h3>👥 Equipos conectados: ${state.teams.length}</h3>${state.teams.map(t=>`<div class="score"><span>${e(t.avatar)} ${e(t.name)}</span><span>LISTO ✓</span></div>`).join('')||'<p class="small">Aún no se han unido mesas.</p>'}${role==='host'?btn('start','▶ INICIAR BATALLA'):'<p>⏳ Esperando al anfitrión…</p>'}</div>${role==='team'?`<div class="panel"><h3>🎭 Cambiar mi avatar</h3><div class="avatars">${avatars.map((a,i)=>`<button class="avatar" data-a="${i}">${a}</button>`).join('')}</div></div>`:''}${rules()}`;if(role==='host')document.getElementById('start').onclick=()=>socket.emit('start',{},r=>{if(!r.ok)alert(r.error)});document.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>socket.emit('avatar',{avatar:avatars[Number(b.dataset.a)]},()=>{}));return}
if(state.status==='finished'){
const podiumCard=(place,klass,owl)=>{const t=state.teams[place-1];return `<div class="podium-contender ${t?'':'podium-empty'}"><div style="font-size:28px">${place===1?'👑':place===2?'🥈':'🥉'}</div>${t?`<img class="podium-owl" src="/emotes/buho-${owl}.webp" onerror="this.replaceWith(document.createTextNode('🦉'))" alt="Búho premiado"><div class="podium-name">${e(t.name)}</div><div class="podium-points">${t.score.toLocaleString('es-MX')} pts</div>`:'<div class="podium-name">Sin equipo</div>'}<div class="podium-step ${klass}"><strong>${place}°</strong><small>${place===1?'ORO':place===2?'PLATA':'BRONCE'}</small></div></div>`};
const others=state.teams.slice(3);app.innerHTML=`<section class="final-screen"><div class="final-kicker">CÓDIGO AZUL · FIN DE PARTIDA</div><h2 class="final-title">🏆 PODIO DE CAMPEONES 🏆</h2><p>Los hospitales que dominaron la comunicación médico-paciente</p><div class="podium">${podiumCard(2,'silver','04')}${podiumCard(1,'gold','04')}${podiumCard(3,'bronze','05')}</div><div class="other-places">${others.map((t,i)=>`<div class="other-place"><span>${i+4}° · ${e(t.avatar)} ${e(t.name)}</span><strong>${t.score.toLocaleString('es-MX')} pts</strong></div>`).join('')}</div><p class="small">Resultados oficiales calculados por el servidor.</p></section>`;return}
const q=state.question;const result=role==='team'&&personal&&personal.index===state.index?personal:null;
const myTeam=state.teams.find(t=>t.name===myName);
const streak=result?result.streak:(myTeam?.streak||0);
const bonus=streak>=8?40:streak>=5?25:streak>=3?10:0;
const correctCount=myTeam?.correctCount??((personalHistory?.count||0)+(result?.correct?1:0));
// Cada equipo conserva una rotación propia durante la partida.
// Los 20 archivos se distribuyen por tipo de reacción; ninguna reacción consecutiva repite imagen.
const EMOTE_POOLS={
  esperando:[5,6],
  acierto:[0,1,2,3,4,7,8,9,17,18,19],
  error:[10,11,12,13,14],
  tiempo:[15,16],
  racha:[2,3,4,17,18,19]
};
const emoteRotation={esperando:0,acierto:0,error:0,tiempo:0,racha:0};
let lastEmoteEvent='',currentEmote=5,lastEmote=-1;
function emoteIndex(){
  let category='esperando';
  if(state.status==='reveal'&&result){
    category=result.timedOut?'tiempo':!result.correct?'error':result.streak>=5?'racha':'acierto';
  }
  // La clave evita que un re-render (ranking, reloj, conexión) cambie el búho.
  const event=state.code+'|'+state.index+'|'+state.status+'|'+category+'|'+(result?.correct??'')+'|'+(result?.streak??'');
  if(event===lastEmoteEvent)return currentEmote;
  lastEmoteEvent=event;
  const pool=EMOTE_POOLS[category];
  let offset=emoteRotation[category]++;
  let next=pool[offset%pool.length];
  if(next===lastEmote&&pool.length>1){next=pool[(offset+1)%pool.length];emoteRotation[category]++}
  lastEmote=next;
  currentEmote=next;
  return next;
}
const emotePath=n=>'/emotes/buho-'+String(n+1).padStart(2,'0')+'.webp';
const phrase=result?.phrase||(state.status==='question'?(selected?'Tu respuesta está registrada. ¡Suerte, doctor!':'Lee el caso y elige con cuidado, doctor.'):'Esperando el resultado de esta ronda...');
const reactionPanel=`<div class="panel reaction"><h3>🦉 REACCIÓN DEL HOSPITAL</h3><img class="emote-img" src="${emotePath(emoteIndex())}" alt="Búho médico"><div class="reaction-phrase">“${e(phrase)}”</div></div>`;
const statsPanel=`<div class="panel"><h3>🔥 TU RACHA</h3><div class="stat-grid"><div><div class="stat-number">${streak}</div><div class="stat-label">Seguidas</div></div><div><div class="stat-number" style="color:#7ce6b2">${myTeam?correctCount:'—'}</div><div class="stat-label">Aciertos</div></div></div><p class="small">⚡ Bonificación actual: +${bonus}%<br>🔥 3 aciertos: +10% · 5 aciertos: +25% · 8 aciertos: +40%</p></div>`;
const roundHeader=`<div class="row"><span class="pill">DESAFÍO ${state.index+1}/${state.total}</span><span class="pill">${q?e(q.difficulty):'RESULTADOS'}</span><span class="pill">${q?'⭐ '+q.base+' puntos':'🏆 Ranking'}</span><span id="timer" class="timer"></span></div><div class="bar"><div style="width:${100*(state.index+1)/state.total}%"></div></div>`;
const questionPanel=q?`<div class="small">${e(q.level)}</div><h2>${e(q.title)}</h2>${role==='team'?q.options.map((a,i)=>`<button class="option" data-i="${i}" ${selected?'disabled':''}>${'ABCD'[i]}. ${e(a)}</button>`).join(''):'<p class="small">Los hospitales están respondiendo desde sus celulares…</p>'}<p id="notice" class="small">${selected?'Respuesta enviada. Esperando al resto de hospitales…':''}</p>`:'';
const resultPanel=state.status==='reveal'?`<div class="answer-banner ${result?(result.correct?'correct':'wrong'):''}"><h2>${result?(result.correct?'✅ ¡RESPUESTA CORRECTA!':'❌ RESPUESTA INCORRECTA'):'📊 RESULTADOS DE LA RONDA'}</h2>${result?`<div class="answer-points">+${result.earned} pts</div><div class="mini-result">🔥 Racha: ${result.streak} · Bono: ${Math.round(result.bonus*100)}% · Puesto: #${result.rank}</div>`:''}</div><h3>Respuesta correcta: ${'ABCD'[state.reveal.correct]}</h3><p class="result-explain">${e(state.reveal.explanation)}</p>${result?`<div class="score-position">${result.above?'⬆️ Adelante: '+e(result.above.name)+' (a '+result.above.gap+' pts)':'👑 ¡Estás en primer lugar!'}</div><p class="score-position">${result.below?'⬇️ Detrás: '+e(result.below.name)+' (a '+result.below.gap+' pts)':'🏁 No tienes equipos detrás'}</p>`:''}${role==='host'?btn('next',state.index===state.total-1?'🏆 VER CAMPEONES':'➡️ SIGUIENTE PREGUNTA'):'<p class="small">Esperando al anfitrión…</p>'}`:'';
app.innerHTML=`${roundHeader}<div class="${role==='host'?'host-board':''}"><div class="game-grid">${scores()}<div class="panel game-center">${questionPanel}${resultPanel}</div>${role==='team'?`<div class="game-side">${statsPanel}${reactionPanel}</div>`:''}</div></div>`;

document.querySelectorAll('.emote-img').forEach(img=>{img.addEventListener('error',()=>{const d=document.createElement('div');d.className='emote-fallback';d.textContent='🦉';img.replaceWith(d)},{once:true})});
if(state.status==='question'){document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(selected)return;socket.emit('answer',{choice:Number(b.dataset.i)},r=>{if(r.ok){selected=true;earned=r.earned;document.querySelectorAll('.option').forEach(x=>x.disabled=true);b.classList.add('correct');const n=document.getElementById('notice');if(n)n.textContent='✔️ Respuesta enviada. Esperando a las demás mesas…'}else{const n=document.getElementById('notice');if(n)n.textContent=r.error||'No se pudo registrar'}})});function tick(){const el=document.getElementById('timer');if(el){const ms=Math.max(0,state.deadline-Date.now());el.textContent='⏱️ '+Math.ceil(ms/1000)+'s';el.className='timer '+(ms>=10000?'fast':'late')}}tick();clock=setInterval(tick,200)}if(state.status==='reveal'&&role==='host')document.getElementById('next').onclick=()=>socket.emit('next',{})}
socket.on('state',s=>{if(room&&s.code!==room)return;if(s.index!==lastIndex){if(personal&&personal.index===lastIndex&&personal.correct){personalHistory={count:(personalHistory?.count||0)+1}}selected=false;earned=null;personal=null;lastIndex=s.index}state=s;render()});socket.on('personal-result',r=>{personal=r;if(state?.status==='reveal'&&state.index===r.index)render()});socket.on('closed',()=>{alert('El anfitrión cerró la sala');location.reload()});home();
</script></body></html>
