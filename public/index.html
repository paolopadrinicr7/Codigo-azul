<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Código Azul | Batalla de Hospitales</title><style>
:root{font-family:system-ui,sans-serif;color:#effaff;background:#06162c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#154978,#06162c 65%);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:24px 14px}h1{font-size:clamp(27px,6vw,48px);color:#66e8ff;margin:10px 0}h2{font-size:23px}.panel{background:#112c4a;border:1px solid #3d719d;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 8px 22px #0003}button,input{font:inherit;border-radius:10px;padding:13px}button{background:#087db4;color:white;border:1px solid #50c5ee;cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:default}input{background:#061b31;border:1px solid #4d789c;color:white;width:100%;margin:8px 0}button.big{width:100%;margin:7px 0}button.option{width:100%;text-align:left;margin:6px 0;background:#1c4469}.small{color:#b9d2e5;font-size:14px}.pill{display:inline-block;background:#235276;border-radius:30px;padding:7px 12px;margin:3px}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar{height:12px;background:#294661;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#25d7e4}.winner{color:#ffdc78}.correct{border-color:#34d399!important;background:#135b49!important}.wrong{border-color:#fb7185!important;background:#713145!important}.score{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #315576}#timer{font-size:34px;color:#ffdd83;font-weight:900}#msg{color:#fca5a5}</style></head><body><main class="wrap"><div class="row"><span class="pill">🚑 HOSPITAL CENTRAL</span><span class="pill">🎮 MULTIJUGADOR EN VIVO</span></div><h1>🚨 CÓDIGO AZUL</h1><div class="small">BATALLA DE HOSPITALES · COMUNICACIÓN MÉDICO-PACIENTE</div><div id="app"></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),app=document.getElementById('app');let role='',room='',state=null,selected=false,clock=null;const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function btn(id,label){return `<button class="big" id="${id}">${label}</button>`}function home(){app.innerHTML=`<div class="panel"><h2>🏆 Compite por tu hospital</h2><p>Una mesa = un hospital. Todas responden al mismo tiempo. 20 desafíos, 5 rondas y 30 segundos por pregunta.</p>${btn('host','🖥️ Soy el anfitrión: crear partida')}<hr style="border-color:#305273"><input id="code" placeholder="Código de 6 dígitos" inputmode="numeric" maxlength="6"><input id="name" placeholder="Nombre de tu hospital (mesa)" maxlength="32">${btn('join','📱 Unirme como mesa')}<p id="msg"></p></div>`;document.getElementById('host').onclick=()=>socket.emit('create',{},r=>{if(r.ok){role='host';room=r.code}});document.getElementById('join').onclick=()=>socket.emit('join',{code:document.getElementById('code').value,name:document.getElementById('name').value},r=>{if(r.ok){role='team';room=document.getElementById('code').value}else document.getElementById('msg').textContent=r.error})}function scores(){return `<div class="panel"><h2>🏅 Clasificación en vivo</h2>${state.teams.map((t,i)=>`<div class="score"><span>${i+1}. ${e(t.name)} ${t.answered&&state.status==='question'?'✓':''}</span><b>${t.score} pts</b></div>`).join('')}</div>`}function render(){if(!state)return;clearInterval(clock);if(state.status==='lobby'){app.innerHTML=`<div class="panel"><h2>🔑 Sala: ${e(state.code)}</h2><p>Comparte este código con las mesas. Cada mesa debe abrir esta misma página en su celular.</p><p class="small">Equipos conectados: ${state.teams.length}</p>${state.teams.map(t=>`<div class="score">🏥 ${e(t.name)}</div>`).join('')}${role==='host'?btn('start','▶ Empezar competencia'): '<p>⏳ Esperando al anfitrión…</p>'}</div>`;if(role==='host')document.getElementById('start').onclick=()=>socket.emit('start',{},r=>{if(!r.ok)alert(r.error)});return}if(state.status==='finished'){app.innerHTML=`<div class="panel" style="text-align:center"><h2>🏆 ¡MISIÓN COMPLETADA!</h2><p class="winner" style="font-size:26px">${state.teams[0]?'🥇 '+e(state.teams[0].name):'Sin equipos'}</p><p>¡Héroes Comunicadores Supremos!</p></div>`+scores();return}const q=state.question;app.innerHTML=`<div class="row"><span class="pill">Desafío ${state.index+1}/${state.total}</span><span class="pill">${e(q?.level||'Resultados de la ronda')}</span><span id="timer"></span></div><div class="bar"><div style="width:${100*(state.index+1)/state.total}%"></div></div>${q?`<div class="panel"><h2>${e(q.title)}</h2>${role==='team'?q.options.map((a,i)=>`<button class="option" data-i="${i}" ${selected?'disabled':''}>${'ABCD'[i]}. ${e(a)}</button>`).join(''):'<div class="small">Las mesas están respondiendo desde sus celulares.</div>'}</div>`:''}${state.status==='reveal'?`<div class="panel"><h2>✅ Respuesta: ${'ABCD'[state.reveal.correct]}</h2><p>${e(state.reveal.explanation)}</p>${role==='host'?btn('next',state.index===19?'🏆 Ver ganadores':'➡️ Siguiente pregunta'):'<p>Esperando la siguiente pregunta…</p>'}</div>`:''}${scores()}`;if(state.status==='question'){document.querySelectorAll('.option').forEach(b=>b.onclick=()=>socket.emit('answer',{choice:Number(b.dataset.i)},r=>{if(r.ok){selected=true;document.querySelectorAll('.option').forEach(x=>x.disabled=true);b.classList.add('correct')}}));function tick(){let el=document.getElementById('timer');if(el)el.textContent='⏱️ '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'s'}tick();clock=setInterval(tick,250)}if(state.status==='reveal'&&role==='host')document.getElementById('next').onclick=()=>{selected=false;socket.emit('next',{})}}socket.on('state',s=>{if(room&&s.code!==room)return;state=s;selected=false;render()});socket.on('closed',()=>{alert('El anfitrión cerró la sala');location.reload()});home();
</script></body></html>
